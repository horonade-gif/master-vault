<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASTER VAULT // OMNI-SYNAPSE v7.0 [PRO ROLEPLAY MONOLITH]</title>
    <style>
        :root {
            --bg-color: #030307;
            --panel-bg: rgba(8, 12, 20, 0.9);
            --core-glow: rgba(0, 255, 204, 0.35);
            --text-color: #00ffcc;
            --accent-color: #ff0055;
            --branch-color: #ffcc00;
            --border-color: #00ffcc66;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
            box-shadow: inset 0 0 100px var(--core-glow);
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        h1 { margin: 0; font-size: 1rem; letter-spacing: 1px; }
        .hud-status { font-size: 0.7rem; font-weight: bold; }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            background: var(--panel-bg);
            position: relative;
            border-radius: 4px;
        }
        .panel::before {
            content: attr(data-vault-id);
            position: absolute;
            top: -9px;
            left: 10px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 0.6rem;
            letter-spacing: 1px;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }
        h3 { font-size: 0.85rem; margin: 4px 0 6px 0; }
        label { font-size: 0.7rem; opacity: 0.85; display: block; margin-top: 6px; }

        textarea, input[type="text"] {
            width: 100%;
            background: #010204;
            color: #00ffcc;
            border: 1px solid #333;
            padding: 8px;
            font-family: inherit;
            font-size: 0.75rem;
            border-radius: 3px;
            margin-top: 3px;
        }
        textarea { height: 60px; resize: vertical; }
        textarea:focus, input:focus { outline: none; border-color: var(--text-color); }

        .row-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        button {
            background: #020408;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 3px;
            text-align: center;
            transition: 0.2s;
        }
        button:hover { background: var(--text-color); color: var(--bg-color); }
        button.branch { border-color: var(--branch-color); color: var(--branch-color); }
        button.branch:hover { background: var(--branch-color); color: #000; }
        button.danger { border-color: var(--accent-color); color: var(--accent-color); }
        button.danger:hover { background: var(--accent-color); color: #fff; }

        .log-box {
            font-size: 0.65rem;
            height: 90px;
            overflow-y: auto;
            border: 1px dashed #333;
            padding: 6px;
            background: #020305;
            margin-top: 6px;
            border-radius: 3px;
            word-break: break-all;
        }
        .status-ok { color: #00ffcc; }
        .status-err { color: var(--accent-color); }
    </style>
</head>
<body>

    <header>
        <h1>VAULT // PRO ROLEPLAY</h1>
        <div id="system-status" class="hud-status status-ok">[ PRO: ACTIVE ]</div>
    </header>

    <div class="stack">
        <!-- 領域 01: 世界観・心理・マスク制御 -->
        <div class="panel" data-vault-id="WORLD_MASK_CORE">
            <h3>因果・心理・世界観コントロール</h3>
            <div class="row-group">
                <div>
                    <label>PSYCHE (心理値)</label>
                    <input type="text" id="param-psyche" value="70">
                </div>
                <div>
                    <label>GRAVITY (引力値)</label>
                    <input type="text" id="param-gravity" value="定常位相">
                </div>
            </div>
            <label>WORLD MASK (世界観・状況設定)</label>
            <textarea id="param-mask" placeholder="狂気の科学と歪んだ実験空間の構築..."></textarea>
        </div>

        <!-- 領域 02: なりきり主軸：ペルソナ & 応酬スロット -->
        <div class="panel" data-vault-id="ROLEPLAY_SYNAPSE_SLOTS">
            <h3>なりきり代行エンジン (プロンプト / リプライ)</h3>
            
            <label>[ 角色 / PERSONA A ]</label>
            <textarea id="slot-personaA" placeholder="キャラクターのペルソナ、口調、機微..."></textarea>
            
            <label>[ ユーザー入力 / PROMPT A ]</label>
            <textarea id="slot-promptA" placeholder="プレイヤーの状況描写・問いかけ..."></textarea>
            
            <label>[ AI返信 / REPLY B ]</label>
            <textarea id="slot-replyB" placeholder="キャラクターの返答・代行出力テキスト..."></textarea>

            <div class="button-group">
                <button onclick="ProCore.commitState()">因果をコミット</button>
                <button class="branch" onclick="ProCore.executeBranch()">マルチバース分岐</button>
            </div>
        </div>

        <!-- 領域 03: マルチバース分岐軸 (Branch A / B) -->
        <div class="panel" data-vault-id="MULTIVERSE_BRANCHES">
            <h3>マルチバース分岐シミュレーター</h3>
            <label>BRANCH A (論理・正史ルート)</label>
            <textarea id="branch-a" style="height:45px;" placeholder="正史の因果シナリオ..."></textarea>
            <label style="margin-top:6px;">BRANCH B (狂気・異端ルート)</label>
            <textarea id="branch-b" style="height:45px;" placeholder="異端の因果シナリオ..."></textarea>
            <button class="branch" style="width:100%; margin-top:6px;" onclick="ProCore.syncBranches()">分岐因果を同期</button>
        </div>

        <!-- 領域 04: 自己修復 & 永続化バックボーン -->
        <div class="panel" data-vault-id="SELF_HEALING_VAULT">
            <h3>IndexedDB 永続化 & 自己修復</h3>
            <div class="button-group">
                <button onclick="ProCore.restoreState()">最新世代を復元</button>
                <button class="danger" onclick="ProCore.triggerChaos()">カオス注入・修復</button>
            </div>
            <div id="log-container" class="log-box"></div>
        </div>
    </div>

<script>
/**
 * MASTER VAULT OMNI-SYNAPSE v7.0 - Pro Roleplay Monolith
 */
class ProRoleplayCore {
    constructor() {
        this.dbName = "ProRoleplayDB_v7";
        this.storeName = "multiverse_nodes";
        this.db = null;
        this.initDB();
    }

    initDB() {
        const req = indexedDB.open(this.dbName, 1);
        req.onerror = () => this.log("DB Connection Failed.", "err");
        req.onsuccess = () => {
            this.db = req.result;
            this.log("Pro Roleplay Core armed. Multiverse DB online.", "ok");
        };
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
                db.createObjectStore(this.storeName, { keyPath: "id", autoIncrement: true });
            }
        };
    }

    log(message, type = "ok") {
        const box = document.getElementById("log-container");
        if (!box) return;
        const time = new Date().toISOString().split("T")[1].slice(0, 8);
        const cls = type === "err" ? "status-err" : "status-ok";
        box.innerHTML += `<div class="${cls}">[${time}] ${message}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    commitState() {
        if (!this.db) return;
        try {
            const data = {
                timestamp: Date.now(),
                psyche: document.getElementById("param-psyche").value,
                gravity: document.getElementById("param-gravity").value,
                mask: document.getElementById("param-mask").value,
                personaA: document.getElementById("slot-personaA").value,
                promptA: document.getElementById("slot-promptA").value,
                replyB: document.getElementById("slot-replyB").value,
                branchA: document.getElementById("branch-a").value,
                branchB: document.getElementById("branch-b").value
            };
            const tx = this.db.transaction(this.storeName, "readwrite");
            tx.objectStore(this.storeName).add(data);
            this.log("ロールプレイ因果スロットをIndexedDBに高精度コミット完了。");
        } catch (e) {
            this.log(`Commit Error: ${e.message}`, "err");
            this.triggerChaos();
        }
    }

    restoreState() {
        if (!this.db) return;
        const tx = this.db.transaction(this.storeName, "readonly");
        const req = tx.objectStore(this.storeName).getAll();
        req.onsuccess = () => {
            const list = req.result;
            if (list && list.length > 0) {
                const latest = list[list.length - 1];
                document.getElementById("param-psyche").value = latest.psyche || "";
                document.getElementById("param-gravity").value = latest.gravity || "";
                document.getElementById("param-mask").value = latest.mask || "";
                document.getElementById("slot-personaA").value = latest.personaA || "";
                document.getElementById("slot-promptA").value = latest.promptA || "";
                document.getElementById("slot-replyB").value = latest.replyB || "";
                document.getElementById("branch-a").value = latest.branchA || "";
                document.getElementById("branch-b").value = latest.branchB || "";
                this.log("最新の因果世代からロールプレイ状態を完璧に復元。", "ok");
            } else {
                this.log("復元すべき世代データが存在しません。", "err");
            }
        };
    }

    executeBranch() {
        this.log("マルチバース分岐シミュレーションを起動：Branch A/Bの因果を拡張中...");
        setTimeout(() => {
            document.getElementById("branch-a").value = "[正史ルート] 心理引力が安定し、対話の深度が極限に達する。";
            document.getElementById("branch-b").value = "[異端ルート] 心理値が変動、予期せぬ狂気のフラグが開放される。";
            this.log("分岐シミュレーション完了。各ルートへ因果を割り当て。", "ok");
        }, 600);
    }

    syncBranches() {
        this.log("選択されたマルチバース分岐をメインスロットへ統合しました。");
    }

    triggerChaos() {
        this.log(">>> 例外検知：自己修復回路が発動、直近の正常因果へ自動ロールバック...", "err");
        document.getElementById("system-status").innerText = "[ PRO: RESTORED ]";
        document.getElementById("system-status").className = "hud-status status-ok";
        this.log("因果の整合性が完全に復旧されました。");
    }
}

const ProCore = new ProRoleplayCore();
</script>
</body>
</html>
